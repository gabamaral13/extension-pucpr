<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pacientes - X-Triagem</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="icon" href="../../css/imagens/x.png" />

    <script src="../../javascript/index.js" defer></script>
  </head>

  <body class="app-page usuario-page">
    <div class="corpo">
      <div class="container_">
        <img class="logo" src="../../css/imagens/x.png" alt="Logo X-Triagem" />
        <h1 class="titulo">Bem-vindo, User</h1>
      </div>

      <div class="corpo_">
        <div class="navegador">
          <div class="dash">
            <h3>Navegador</h3>
          </div>

          <div class="espaco">
            <a href="./dashboard_usuario.html">
              <button class="botoes_areas" type="button">Dashboard</button>
            </a>
            <br />

            <a href="./pacientes_usuario.html">

            </div>

            <div>
              <a href="./cadastropaciente_usuario.html">

                </button>
              </a>
            </div>

          <div class="buscar_paciente">

          <div class="lista_pacientes"></div>
        </div>
      </div>
