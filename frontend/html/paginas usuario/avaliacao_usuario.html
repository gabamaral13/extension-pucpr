<!doctype html>
<html lang="pt-BR">
  <head>

    <title>Avaliação - X-Triagem</title>

    <link
      rel="stylesheet"
      href="../../css/paginas usuario/avaliacao__usuario.css"
    />
    <link rel="icon" href="../../css/imagens/x.png" />

    <script src="../../javascript/index.js" defer></script>
  </head>

  <body>
    <div class="corpo">
      <div class="container_">
        <img class="logo" src="../../css/imagens/x.png" alt="Logo X-Triagem" />
        <h1 class="titulo">Bem-vindo, User</h1>
      </div>

      <div class="corpo_">
        <div class="navegador">
          <div class="dash">
            <h3>Navegador</h3>
          </div>

          <div class="espaco">
            <a href="./dashboard_usuario.html">
              <button class="botoes_areas" type="button">Dashboard</button>

            <br />

            <a href="./pacientes_usuario.html">

            <br />

            <a href="./avaliacao_usuario.html">

            </div>

            <div class="paciente">
              <p>Paciente</p>
              <input type="text" placeholder="Selecionar paciente" />
